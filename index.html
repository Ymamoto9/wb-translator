<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#481173">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Переводчик">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Переводчик РУ ⇄ КОР</title>
<style>
  :root{
    --wb-purple:#481173; --wb-pink:#cb11ab; --wb-grad:linear-gradient(135deg,#481173 0%,#cb11ab 100%);
    --bg:#f6f5f8; --card:#ffffff; --ink:#1e0a3c; --muted:#8a8798;
    --line:#e9e3f1; --ok:#12b558; --danger:#e02020; --amber:#f5a623;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--wb-grad);
    box-shadow:0 2px 8px rgba(72,17,115,.35);
  }
  .hdr-left{display:flex; align-items:center; gap:10px;}
  .wb-logo{
    background:#fff; color:var(--wb-purple); font-weight:900; font-size:13px;
    border-radius:8px; padding:3px 7px; letter-spacing:.5px;
  }
  .chip{
    font-weight:800; font-size:15px; letter-spacing:1px; color:#fff;
    background:rgba(255,255,255,.18); border-radius:10px; padding:5px 12px;
  }
  .chip-b{opacity:.75;}
  #swap{
    background:#fff; color:var(--wb-purple); border:none;
    border-radius:10px; font-size:18px; padding:5px 12px; cursor:pointer; font-weight:800;
  }
  #swap:active{background:#f3e8fb;}
  #swap:disabled{opacity:.5;}
  #infoBtn{
    background:rgba(255,255,255,.2); border:none; color:#fff;
    width:30px; height:30px; border-radius:50%; font-size:15px; font-weight:800;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #infoBtn:active{background:rgba(255,255,255,.35);}

  main{flex:1; display:flex; flex-direction:column; min-height:0; padding:10px; gap:10px;}

  /* ---- режим диалога ---- */
  #dlgBtn{
    width:100%; border:none; cursor:pointer; color:#fff;
    background:var(--wb-grad); border-radius:14px;
    padding:14px; font-size:16px; font-weight:800; letter-spacing:.3px;
    box-shadow:0 3px 10px rgba(203,17,171,.35);
  }
  #dlgBtn:active{filter:brightness(1.08);}
  #dlgBtn:disabled{opacity:.5; box-shadow:none;}
  #dlgActive{
    background:var(--card); border:2px solid var(--wb-pink); border-radius:14px;
    padding:14px; display:flex; flex-direction:column; gap:12px;
  }
  .hidden{display:none !important;}
  .dlg-state{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px;}
  .dot{width:14px; height:14px; border-radius:50%; background:var(--muted); flex-shrink:0;}
  .dot.listening{background:var(--ok); animation:pulse 1.1s infinite;}
  .dot.translating{background:var(--amber); animation:pulse .7s infinite;}
  .dot.speaking{background:var(--wb-pink); animation:pulse .9s infinite;}
  .dot.idle{background:var(--muted);}
  @keyframes pulse{50%{opacity:.35;}}
  #dlgStop{
    border:2px solid var(--danger); background:#fff; color:var(--danger);
    border-radius:10px; padding:10px; font-size:15px; font-weight:800; cursor:pointer;
  }
  #dlgStop:active{background:#fdeaea;}
  .dlg-row{display:flex; align-items:center; gap:6px;}
  .dlg-label{font-size:13px; color:var(--muted); font-weight:700;}
  .seg{
    flex:1; border:1px solid var(--line); background:#fff; color:var(--muted);
    border-radius:8px; padding:8px 4px; font-weight:800; font-size:13px; cursor:pointer;
  }
  .seg.active{background:var(--wb-grad); color:#fff; border-color:transparent;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px;}
  .panel .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .tag{font-size:12px; font-weight:800; color:var(--wb-purple); letter-spacing:1px;}

  #input{
    width:100%; min-height:72px; resize:none; border:none; outline:none;
    background:transparent; color:var(--ink); font-size:19px; line-height:1.4;
  }
  #input::placeholder{color:#b3aec2;}

  #output{font-size:21px; line-height:1.45; min-height:72px; word-break:break-word; white-space:pre-wrap;}
  #output.empty{color:#b3aec2;}
  #roman{
    font-size:14px; color:var(--muted); font-style:italic; margin-top:8px;
    word-break:break-word; border-top:1px solid var(--line); padding-top:6px;
  }

  .row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  button.act{
    background:#f4eef8; border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:10px 14px; font-size:15px; cursor:pointer; font-weight:600;
  }
  button.act:active{background:#eadff3;}
  button.primary{
    color:#fff; border:none; font-weight:800;
    background:var(--wb-grad);
  }
  button.primary:active{filter:brightness(1.08);}
  button.mic{
    background:var(--wb-grad); border:none; color:#fff;
    border-radius:50%; width:54px; height:54px; font-size:24px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 10px rgba(203,17,171,.35);
  }
  button.mic.rec{background:var(--danger); animation:pulse 1s infinite;}
  button.mic:disabled{opacity:.4; box-shadow:none;}

  .toggles{display:flex; gap:14px; align-items:center; font-size:14px; color:var(--muted);}
  .toggles label{display:flex; gap:6px; align-items:center; cursor:pointer;}
  .toggles input{accent-color:var(--wb-pink);}

  #status{min-height:18px; font-size:13px; color:var(--muted); padding:0 4px;}
  #status.err{color:var(--danger);}
  #status.ok{color:var(--ok);}

  #history{flex:1; overflow-y:auto; min-height:60px; display:flex; flex-direction:column; gap:8px;}
  .msg{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:8px 12px; max-width:92%;
  }
  .msg.me{align-self:flex-end; border-radius:14px 14px 4px 14px;}
  .msg.them{align-self:flex-start; border-radius:14px 14px 14px 4px; background:#f4eef8;}
  .msg .who{font-size:11px; font-weight:800; letter-spacing:.5px; color:var(--wb-purple);}
  .msg.them .who{color:var(--wb-pink);}
  .msg .orig{font-size:14px; color:var(--muted); margin-top:2px; word-break:break-word;}
  .msg .dst{font-size:16px; font-weight:600; margin-top:4px; word-break:break-word;}
  .hist-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px;}
  .hist-head span{font-size:12px; font-weight:800; color:var(--muted); letter-spacing:1px;}
  #chatExpand{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:8px; padding:4px 10px; font-size:13px; font-weight:700; cursor:pointer;
  }
  #chatExpand:active{background:#eadff3;}
  #chatFull{position:fixed; inset:0; background:var(--bg); z-index:60; display:flex; flex-direction:column;}
  #chatFull .cf-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--wb-grad); color:#fff; font-weight:800; font-size:16px;
  }
  #chatClose{
    background:rgba(255,255,255,.2); border:none; color:#fff;
    border-radius:8px; padding:6px 14px; font-weight:800; font-size:14px; cursor:pointer;
  }
  #chatClose:active{background:rgba(255,255,255,.35);}
  #chatFullList{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:10px;}
  #chatFullList .msg{max-width:96%;}
  .h-item{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; font-size:15px; cursor:pointer;
  }
  .h-item:active{background:#f8f2fc;}
  .h-dir{font-size:11px; font-weight:800; color:var(--wb-pink); letter-spacing:.5px;}
  .h-src{color:var(--muted); font-size:13px; margin:2px 0;}
  .h-dst{font-size:15px;}
  .h-empty{color:#b3aec2; font-size:14px; text-align:center; padding:12px;}

  footer{
    padding:6px 10px calc(6px + env(safe-area-inset-bottom));
    font-size:11px; color:#b3aec2; text-align:center;
  }

  /* ---- инфо-модалка ---- */
  .modal{
    position:fixed; inset:0; background:rgba(30,10,60,.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-card{
    background:#fff; border-radius:18px; padding:20px; max-width:340px; width:100%;
    box-shadow:0 10px 40px rgba(30,10,60,.4);
  }
  .modal-title{
    font-weight:900; font-size:18px; margin-bottom:12px; color:var(--wb-purple);
  }
  .modal-card p{font-size:15px; line-height:1.6; margin:0 0 16px;}
  #infoClose{
    width:100%; border:none; cursor:pointer; color:#fff;
    background:var(--wb-grad); border-radius:10px; padding:12px;
    font-size:15px; font-weight:800;
  }
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <span class="wb-logo">RWB</span>
    <span class="chip" id="langFrom">РУС</span>
    <button id="swap" title="Поменять языки">⇄</button>
    <span class="chip chip-b" id="langTo">КОР</span>
  </div>
  <button id="infoBtn" title="О программе">ⓘ</button>
</header>

<main>
  <button id="dlgBtn">💬 Режим диалога — включить</button>

  <div id="dlgActive" class="hidden">
    <div class="dlg-state"><span class="dot idle" id="dlgDot"></span><span id="dlgText">Готов</span></div>
    <div class="dlg-row">
      <span class="dlg-label">Слушать:</span>
      <button class="seg active" id="expAuto">АВТО</button>
      <button class="seg" id="expRu">РУС</button>
      <button class="seg" id="expKo">КОР</button>
    </div>
    <button id="dlgStop">■ Остановить диалог</button>
  </div>

  <section class="panel">
    <div class="top"><span class="tag" id="tagIn">РУССКИЙ</span>
      <div class="toggles">
        <label><input type="checkbox" id="autoTr" checked>авто</label>
        <label><input type="checkbox" id="autoSpeak" checked>озвучка</label>
      </div>
    </div>
    <textarea id="input" placeholder="Введите текст или нажмите микрофон…" enterkeyhint="send"></textarea>
    <div class="row">
      <button class="mic" id="mic" title="Голосовой ввод">🎤</button>
      <button class="act primary" id="go" style="flex:1">Перевести</button>
      <button class="act" id="clear" title="Очистить">✕</button>
    </div>
  </section>

  <section class="panel">
    <div class="top"><span class="tag" id="tagOut">КОРЕЙСКИЙ</span></div>
    <div id="output" class="empty">…</div>
    <div id="roman" class="hidden"></div>
    <div class="row">
      <button class="act" id="speak" style="flex:1">🔊 Озвучить</button>
      <button class="act" id="copy">📋 Копировать</button>
    </div>
  </section>

  <div id="status"></div>

  <div class="hist-head"><span>💬 ЧАТ ДИАЛОГА</span><button id="chatExpand">⛶ Развернуть</button></div>
  <div id="history"><div class="h-empty">История пуста</div></div>
</main>

<footer>Нужен интернет (перевод и голос). Озвучка работает офлайн.</footer>

<div id="infoModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title">О программе</div>
    <p>Программа разработана <b>Бондарюк Даниил Романович</b>.<br>
    Тренер СК Владивосток.<br><br>
    <b>Распространение запрещено.</b></p>
    <button id="infoClose">Закрыть</button>
  </div>
</div>

<div id="chatFull" class="hidden">
  <div class="cf-head"><span>💬 Чат диалога</span><button id="chatClose">✕ Закрыть</button></div>
  <div id="chatFullList"></div>
</div>

<script>
'use strict';
var $ = function(id){ return document.getElementById(id); };
var input = $('input'), output = $('output'), statusEl = $('status');
var micBtn = $('mic'), goBtn = $('go');
var ru = 'ru', ko = 'ko';
var dir = ru + '2' + ko;               // текущее направление
var busy = false, trTimer = null, lastResult = '';
var dialogLog = [];
var listening = false;
var dialogMode = false;
var dlgExpect = 'auto';        // 'auto' | 'ru' | 'ko' — кого слушаем
var dlgLastSpeaker = null;     // кто говорил последний раз
var dlgMisses = 0;             // подряд неудачных прослушек
var dlgFlip = false;           // принудительно сменить язык прослушивания
var recog = null;
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var recogReset = null, makeRecog = null, webStop = null, webStart = null;   // назначаются в браузерной ветке ниже

var LANG = { ru:'РУССКИЙ', ko:'КОРЕЙСКИЙ' };
var SHORT = { ru:'РУС', ko:'КОР' };
var BCP  = { ru:'ru-RU', ko:'ko-KR' };
var NATIVE = !!(window.AndroidBridge && window.AndroidBridge.startListen);

// ---- инфо ----
$('infoBtn').addEventListener('click', function(){ $('infoModal').classList.remove('hidden'); });
$('infoClose').addEventListener('click', function(){ $('infoModal').classList.add('hidden'); });
$('infoModal').addEventListener('click', function(e){ if (e.target === this) this.classList.add('hidden'); });

function setDir(a, b){
  dir = a + '2' + b;
  $('langFrom').textContent = SHORT[a];
  $('langFrom').classList.remove('chip-b');
  $('langTo').textContent = SHORT[b];
  $('langTo').classList.add('chip-b');
  $('tagIn').textContent  = LANG[a];
  $('tagOut').textContent = LANG[b];
}
setDir(ru, ko);

$('swap').addEventListener('click', function(){
  if (dialogMode) return;
  var a = dir.split('2')[0], b = dir.split('2')[1];
  if (listening && NATIVE) AndroidBridge.stopListen();
  // при смене направления переносим готовый перевод в поле ввода
  if (lastResult) {
    input.value = lastResult;
    output.textContent = input.value ? '' : '…';
    if (!input.value) output.classList.add('empty');
    lastResult = '';
  }
  setDir(b, a);
  if (input.value.trim()) translateNow();
});

// [варианты написания, точный корейский/русский перевод]

  [['단말기','티에스디'], 'ТСД'],

function W(x){ return Array.isArray(x) ? x : [x]; }
function normRu(s){
  return s.toLowerCase().replace(/ё/g,'е')
    .replace(/[!.,;:?«»"()\-]+/g,' ').replace(/\s+/g,' ').trim();
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// --- северокорейская нормализация: южные слова → северные (문화어) ---
var NK_NORM = [
  ['급여','로임'], ['컴퓨터','전자계산기'], ['주스','열매즙'],
  ['아이스크림','얼음과자'], ['텔레비전','텔레비죤'], ['스포츠','체육'],
  ['장난감','완구'], ['패스','출입증']
];
// деловой формальный стиль (합니다체) вместо разговорного (해요체)
var FORMAL = [
  ['주세요','주십시오'], ['하세요','하십시오'], ['가세요','가십시오'],
  ['오세요','오십시오'], ['보세요','보십시오'], ['드세요','드십시오'],
  ['먹어요','먹습니다'], ['마셔요','마십니다'], ['해요','합니다'],
  ['가요','갑니다'], ['와요','옵니다'], ['봐요','봅니다'], ['줘요','줍니다'],
  ['있어요','있습니다'], ['없어요','없습니다'], ['좋아요','좋습니다'],
  ['괜찮아요','괜찮습니다'], ['알았어요','알았습니다'], ['아니요','아닙니다'],
  ['그래요','그렇습니다'], ['예요','입니다'], ['이에요','입니다'],
  ['됐어요','됐습니다'], ['끝났어요','끝났습니다'], ['시작해요','시작합니다'],
  ['기다려요','기다립니다'], ['했어요','했습니다'], ['갔어요','갔습니다'],
  ['왔어요','왔습니다'], ['필요해요','필요합니다']
];
function applyNKStyle(out){
  NK_NORM.forEach(function(p){
    if (out.indexOf(p[0]) !== -1){
      out = fixParticles(out.split(p[0]).join(p[1]), p[1]);
    }
  });
  FORMAL.forEach(function(p){ out = out.split(p[0]).join(p[1]); });
  return out;
}

// чиним частицы после подставленного корейского слова (을/를, 이/가, 은/는,
// 과/와, 으로/로 — выбор зависит от того, кончается ли слово на гласную)
function hangulEndsVowel(s){
  var c = s.charCodeAt(s.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return null;
  return ((c - 0xAC00) % 28) === 0;   // true = последняя гласная
}
function fixParticles(text, term){
  var vowel = hangulEndsVowel(term);
  if (vowel === null) return text;
  var i = text.indexOf(term);
  while (i !== -1){
    var j = i + term.length;
    var nxt = text.charAt(j);
    var fix = null;
    if (vowel){
      if (nxt === '을') fix = '를';
      else if (nxt === '이') fix = '가';
      else if (nxt === '은') fix = '는';
      else if (nxt === '과') fix = '와';
      else if (nxt === '으') fix = '로';
      else if (nxt === '아') fix = '야';
    } else {
      if (nxt === '를') fix = '을';
      else if (nxt === '가') fix = '이';
      else if (nxt === '는') fix = '은';
      else if (nxt === '와') fix = '과';
      else if (nxt === '로') fix = '으로';
      else if (nxt === '야') fix = '아';
    }
    if (fix) text = text.slice(0, j) + fix + text.slice(j + nxt.length);
    i = text.indexOf(term, j);
  }
  return text;
}

// несклоняемые сокращения (ТСД, КГТ, РЦ...) — безопасны для подстановки
// в готовую фразу: падеж у них не меняется
function isIndeclinableRu(v){
  return /^[A-ZА-ЯЁ0-9][A-ZА-ЯЁ0-9\- .]*$/.test(v);
}

// Заменяем термины словаря на токены T1Q.. до машинного перевода,
// после перевода возвращаем точные значения. Если input целиком — термин
// из словаря, машинный перевод не нужен вообще (exact).
function applyGlossary(text, sl, cb){
  var gloss = (sl === 'ru') ? GLOSS_RU : GLOSS_KO;
  var norm = (sl === 'ru') ? normRu(text) : text.trim().replace(/[.!?,]+$/,'');
  var i, j, v;
  for (i = 0; i < gloss.length; i++){
    for (j = 0; j < W(gloss[i][0]).length; j++){
      v = W(gloss[i][0])[j];
      if (norm === ((sl === 'ru') ? normRu(v) : v)){
        cb({ text: gloss[i][1], tokens: [], exact: true });
        return;
      }
    }
  }
  // длинные варианты раньше коротких
  var entries = [];
  gloss.forEach(function(g){
    W(g[0]).forEach(function(v2){ entries.push([v2, g[1]]); });
  });
  entries.sort(function(a,b){ return b[0].length - a[0].length; });
  var t = text, tokens = [], idx = 0;
  entries.forEach(function(e){
    var term = e[0];
    if (sl === 'ru'){
      // русские слова склоняются: ищем основу слова + окончание.
      // варианты: полное слово и слово без последней буквы
      var variants = [term];
      if (/[а-яё]$/i.test(term) && term.length >= 5) variants.push(term.slice(0, -1));
      if (term.indexOf(' ') !== -1){
        // в словосочетаниях склоняется только последнее слово
        var parts = term.split(' ');
        var last = parts.pop();
        var v2 = [last];
        if (/[а-яё]$/i.test(last) && last.length >= 4) v2.push(last.slice(0, -1));
        variants = v2.map(function(l){ return parts.join(' ') + ' ' + l; });
      }
      variants.forEach(function(stem){
        var esc = escRe(stem).replace(/ё/g,'[её]');
        var re = new RegExp('(^|[^а-яё])(' + esc + '[ауеиыоюьй]?)($|[^а-яё])', 'gi');
        if (re.test(t)){
          idx++;
          t = t.replace(re, '$1T' + idx + 'Q$3');
          tokens.push(['T' + idx + 'Q', e[1]]);
        }
      });
    } else {
      // обратное направление: подставляем только несклоняемые сокращения
      // (ТСД, КГТ...), обычные слова машинный перевод делает сам и без
      // ошибок падежа
      if (t.indexOf(term) !== -1 && isIndeclinableRu(e[1])){
        idx++;
        t = t.split(term).join('T' + idx + 'Q');
        tokens.push(['T' + idx + 'Q', e[1]]);
      }
    }
  });
  cb({ text: t, tokens: tokens, exact: false });
}

// ---------- перевод ----------
function setStatus(msg, cls){
  statusEl.textContent = msg || '';
  statusEl.className = cls || '';
}

// Серверы перевода по очереди: если основной недоступен (например, VPN
// режет запросы к translate.googleapis.com), пробуем запасные
var MT_ENDPOINTS = [
function(q, sl, tl){
  return 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=rm&sl=' + sl + '&tl=' + tl + '&q=' + encodeURIComponent(q);
},
  function(q, sl, tl){
    return 'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=' + sl + '&tl=' + tl + '&q=' + encodeURIComponent(q);
  },
  function(q, sl, tl){
    return 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=' + sl + '|' + tl;
  }
];

function parseMT(data, ep){
  try{
    if (ep === 0){
      var out = '';
      data[0].forEach(function(seg){ if (seg[0]) out += seg[0]; });
      return out || null;
    }
    if (ep === 1){ // dict-chrome-ex: ["перевод"] или [[["перевод",...]]]
      if (typeof data[0] === 'string') return data[0];
      if (data[0] && typeof data[0][0] === 'string') return data[0][0];
      if (data[0] && data[0][0] && typeof data[0][0][0] === 'string') return data[0][0][0];
      return null;
    }
    if (ep === 2){
      return (data && data.responseData && data.responseData.translatedText) || null;
    }
  }catch(e){ return null; }
  return null;
}

// --- транскрипция кириллицей (как произнести по-корейски русскому) ---
function parseRom(data, ep){
  try{
    if (ep === 0){
      var rom = '';
      data[0].forEach(function(seg){
        if (!seg[0] && seg.length > 2){ var r = seg[2] || seg[3]; if (r) rom += r; }
      });
      return rom || null;
    }
    if (ep === 1){
      try{ return data[0][0][3] || null; }catch(e){ return null; }
    }
  }catch(e){}
  return null;
}
function latToCyr(s){
  if (!s) return '';
  s = s.toLowerCase();
  var rules = [
    ['yeo','ё'],['ya','я'],['yo','ё'],['yu','ю'],['ye','е'],
    ['ae','э'],['oe','ве'],['eo','о'],['eu','ы'],['ui','ый'],['wi','ви'],
    ['kk','кк'],['tt','тт'],['pp','пп'],['ss','сс'],['jj','чч'],
    ['ng','н'],['ch','ч'],['sh','ш'],
    ['a','а'],['b','б'],['d','д'],['e','е'],['g','г'],['h','х'],['i','и'],
    ['j','дж'],['k','к'],['l','ль'],['m','м'],['n','н'],['o','о'],['p','п'],
    ['r','р'],['s','с'],['t','т'],['u','у'],['w','в'],['y','й'],
    ['f','ф'],['v','в'],['z','з']
  ];
  var out = '', i = 0;
  while (i < s.length){
    var hit = null;
    for (var k = 0; k < rules.length; k++){
      if (s.substr(i, rules[k][0].length) === rules[k][0]){ hit = rules[k]; break; }
    }
    if (hit){ out += hit[1]; i += hit[0].length; }
    else { out += s.charAt(i); i++; }
  }
  return out;
}
function setRoman(text){
  var el = $('roman');
  if (text){ el.textContent = '🔊 Произносится: «' + text + '»'; el.classList.remove('hidden'); }
  else el.classList.add('hidden');
}
function mtRoman(text, done){
  var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=rm&sl=ko&tl=en&q=' + encodeURIComponent(text);
  fetch(url)
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){ done(parseRom(data, 0)); })
    .catch(function(){ done(null); });
}
function showRoman(out, tl, rom){
  if (tl !== 'ko'){ setRoman(null); return; }
  if (rom){ setRoman(latToCyr(rom)); return; }
  // романизации нет (точный термин из словаря / запасной сервер) — запросим отдельно
  if (/[가-힣]/.test(out)){
    mtRoman(out, function(r){ setRoman(r ? latToCyr(r) : null); });
  } else setRoman(null);
}

function mtFetch(q, sl, tl, done){
  var attempt = function(ep){
    if (ep >= MT_ENDPOINTS.length){ done(null, null); return; }
    fetch(MT_ENDPOINTS[ep](q, sl, tl))
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data){
        var out = parseMT(data, ep);
        if (out){ done(out, parseRom(data, ep)); }
        else attempt(ep + 1);
      })
      .catch(function(){ attempt(ep + 1); });
  };
  attempt(0);
}

// cb(ok, outText)
function doTranslate(text, sl, tl, cb){
  applyGlossary(text, sl, function(g){
    if (g.exact){
      lastResult = g.text;
      output.textContent = g.text;
      output.classList.remove('empty');
      addHistory(text, g.text, sl, tl);
      busy = false;
      setStatus('📖 Термин из словаря склада', 'ok');
      cb(true, g.text);
      return;
    }
    mtFetch(g.text, sl, tl, function(out, rom){
      if (!out){
        busy = false;
        setStatus('Ошибка перевода. Возможно, мешает VPN — смените сервер или выключите его', 'err');
        cb(false, null);
        return;
      }
      var missing = 0;
      g.tokens.forEach(function(p){
        if (out.indexOf(p[0]) !== -1) out = fixParticles(out.split(p[0]).join(p[1]), p[1]);
        else missing++;
      });
      if (sl === 'ru') out = applyNKStyle(out);
      if (g.tokens.length && missing === 0){
        lastResult = out;
        output.textContent = out;
        output.classList.remove('empty');
        addHistory(text, out, sl, tl);
        busy = false;
        showRoman(out, tl, null);
        setStatus('📖 Словарь склада: ' + g.tokens.length + ' терм.', 'ok');
        cb(true, out);
      } else if (g.tokens.length){
        // токены исказились — повторяем машинный перевод без словаря
        mtFetch(text, sl, tl, function(raw){
          if (raw){
            if (sl === 'ru') raw = applyNKStyle(raw);
            lastResult = raw;
            output.textContent = raw;
            output.classList.remove('empty');
            addHistory(text, raw, sl, tl);
            busy = false;
            showRoman(raw, tl, null);
            setStatus('Перевод без словаря (термины не закрепились)', 'err');
            cb(true, raw);
          } else {
            busy = false;
            setStatus('Ошибка перевода. Возможно, мешает VPN — смените сервер или выключите его', 'err');
            cb(false, null);
          }
        });
      } else {
        lastResult = out;
        output.textContent = out;
        output.classList.remove('empty');
        addHistory(text, out, sl, tl);
        busy = false;
        showRoman(out, tl, null);
        setStatus('', 'ok');
        cb(true, out);
      }
    });
  });
}

// cb(true/false) — после завершения; если cb передан, автопроговаривание не делаем
function translateNow(cb){
  var text = input.value.trim();

    if (cb) cb(ok, out);

  });
}

// iOS Safari разрешает звук только после воспроизведения, запущенного
// ПРЯМЫМ касанием. Поэтому при первом касании: возобновляем AudioContext,
// проигрываем тихий wav-файл (разблокирует <audio>) и «прогреваем»
// speechSynthesis. Дальше программные play() работают
var ttsUnlocked = false;
var gtAudioEl = null;   // постоянный разблокированный аудио-элемент
function unlockTTS(){
  if (NATIVE || ttsUnlocked || !SR && !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.getVoices();
    var u = new SpeechSynthesisUtterance('а');
    u.volume = 0.03;   // чуть слышно — iOS засчитывает только реальную речь
    speechSynthesis.speak(u);
  }catch(e){}
  try{
    audioBeep = audioBeep || new (window.AudioContext || window.webkitAudioContext)();
    if (audioBeep.state === 'suspended') audioBeep.resume();
  }catch(e){}
  try{
    if (!gtAudioEl){
      gtAudioEl = new Audio('silent.wav');
      gtAudioEl.volume = 0.01;
      var p = gtAudioEl.play();
      if (p && p.catch) p.catch(function(){});
    }
  }catch(e){}
  ttsUnlocked = true;
}
document.addEventListener('touchstart', unlockTTS, {passive:true});
document.addEventListener('click', unlockTTS, {passive:true});
try{
  if ('speechSynthesis' in window && speechSynthesis.addEventListener){
    speechSynthesis.addEventListener('voiceschanged', function(){ speechSynthesis.getVoices(); });
  }
}catch(e){}

// iOS иногда игнорирует u.lang без явного u.voice — ищем голос по языку
function pickVoice(lang){
  try{
    var vs = speechSynthesis.getVoices() || [];
    for (var i = 0; i < vs.length; i++){
      var vl = (vs[i].lang || '').toLowerCase().replace('_','-');
      if (vl.indexOf(lang) === 0) return vs[i];
    }
  }catch(e){}
  return null;
}

function splitForTTS(text, max){
  var parts = [], s = text.trim();
  while (s.length > max){
    var cut = s.lastIndexOf(' ', max);
    if (cut < max / 2) cut = max;
    parts.push(s.slice(0, cut).trim());
    s = s.slice(cut).trim().replace(/^[,\.]\s*/, '');
  }
  if (s.length) parts.push(s);
  return parts;
}

// онлайн-голос Google Translate (как в Гугл-переводчике): корейский — женский,
// русский — мужской. Ошибка → откат на системный синтезатор (sysSpeak)
function speakGT(text, lang, onend, onfail){
  try{
    speechSynthesis.cancel();
    var url = 'https://translate.google.com/translate_tts?ie=UTF-8' +
      '&client=tw-ob&ttsspeed=1&tl=' + lang + '&q=' + encodeURIComponent(text);
    var a;
    if (gtAudioEl){ a = gtAudioEl; a.src = url; }   // разблокированный на iOS элемент
    else a = new Audio(url);
    window._gtAudio = a;
    var done = false;
    var fin = function(){ if (!done){ done = true; if (onend) onend(); } };
    var fail = function(){ if (!done){ done = true; a.src = ''; if (onfail) onfail(); } };
    a.onerror = fail;
    a.onended = fin;
    var p = a.play();
    if (p && p.catch) p.catch(function(){ fail(); });
    // страховка: если за 5 с звук так и не пошёл — системный голос
    setTimeout(function(){ if (!done && (!a.currentTime || a.paused && !a.ended)) fail(); }, 5000);
  }catch(e){ if (onfail) onfail(); }
}

// системный синтезатор (на iOS — основной способ озвучки)
function sysSpeak(text, lang, onend){
  if (!('speechSynthesis' in window)){ if (onend) onend(); return; }
  try{
    var finished = false;
    var fin = function(){
      if (finished) return;
      finished = true;
      if (onend) onend();
    };
    var attach = function(){
      var u = new SpeechSynthesisUtterance(text);
      u.lang = BCP[lang];
      var v = pickVoice(lang);
      if (v) u.voice = v;
      u.rate = 0.95;
      u.onend = fin;
      u.onerror = function(ev){
        if (!v && !finished){
          setStatus('Нет голоса для языка ' + LANG[lang] + ': на iPhone — Настройки → Универсальный доступ → Проговаривание речи → Голоса', 'err');
        }
        fin();
      };
      window._curUtter = u;   // iOS: без ссылки фраза может «испариться»
      speechSynthesis.speak(u);
      // страховка от молчания iOS: если события не пришли — продолжаем
      setTimeout(fin, Math.max(8000, text.length * 150));
    };
    // iOS подгружает список голосов асинхронно — без него выбор голоса не работает
    var vs = speechSynthesis.getVoices();
    if (vs && vs.length){
      attach();
    } else {
      var waited = false;
      var w = function(){
        if (waited) return;
        waited = true;
        try{ speechSynthesis.removeEventListener('voiceschanged', w); }catch(e){ speechSynthesis.onvoiceschanged = null; }
        attach();
      };
      try{ speechSynthesis.addEventListener('voiceschanged', w); }catch(e){ speechSynthesis.onvoiceschanged = w; }
      setTimeout(w, 1500);
    }
  }catch(e){ if (onend) onend(); }
}

var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function speak(text, lang, onend){
  if (!text){ if (onend) onend(); return; }
  if (NATIVE){
    window._speakEnd = onend || null;
    AndroidBridge.speak(text, lang);
    return;
  }
  unlockTTS();
  var parts = splitForTTS(text, 180);
  var idx = 0;
  var playNext = function(){
    if (idx >= parts.length){ if (onend) onend(); return; }
    var p = parts[idx++];
    if (IS_IOS){
      // на iOS надёжнее всего системный синтезатор (женский корейский голос «Yuna»)
      sysSpeak(p, lang, playNext);
    } else {
      speakGT(p, lang, playNext, function(){
        // онлайн-голос не удался — озвучиваем остаток системным голосом
        var rest = (p + ' ' + parts.slice(idx).join(' ')).trim();
        idx = parts.length;
        sysSpeak(rest, lang, onend);
      });
    }
  };
  playNext();
}
window.onNativeSpeakDone = function(){
  if (window._speakEnd){ var f = window._speakEnd; window._speakEnd = null; f(); }
};
$('speak').addEventListener('click', function(){ speak(lastResult || output.textContent, dir.split('2')[1]); });

// ---------- звуки диалога ----------
var audioBeep = null;
function tone(freq, dur, delay){
  try{
    audioBeep = audioBeep || new (window.AudioContext || window.webkitAudioContext)();
    if (audioBeep.state === 'suspended') audioBeep.resume();
    var o = audioBeep.createOscillator(), g = audioBeep.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.value = 0.12;
    o.connect(g); g.connect(audioBeep.destination);
    var t0 = audioBeep.currentTime + (delay || 0);
    o.start(t0); o.stop(t0 + dur);
  }catch(e){}
}
function beepAccepted(){ tone(920, 0.09); tone(1240, 0.09, 0.1); }
function beepSent(){ tone(660, 0.07); tone(660, 0.07, 0.12); }

// ---------- измеритель громкости микрофона (громкость = речь, тишина = шум) ----------
var micStream = null, analyser = null, volLoopId = null;
var lastLoudAt = 0, speechSeen = false, listenStartedAt = 0, finalizedFlag = false;
var VOL_TRESH = 0.04;

function startMeter(){
  if (NATIVE || !SR || micStream) return;
  try{
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
      micStream = st;
      var AC = window.AudioContext || window.webkitAudioContext;
      audioBeep = audioBeep || new AC();
      var src = audioBeep.createMediaStreamSource(st);
      analyser = audioBeep.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
    }).catch(function(){ /* без метра работаем по таймерам */ });
  }catch(e){}
}
function rms(){
  if (!analyser) return 0;
  var buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  var s = 0;
  for (var i = 0; i < buf.length; i++){ var v = (buf[i] - 128) / 128; s += v * v; }
  return Math.sqrt(s / buf.length);
}
function stopMeter(){
  if (volLoopId){ clearInterval(volLoopId); volLoopId = null; }
}
function startVolLoop(){
  stopMeter();
  volLoopId = setInterval(function(){
    if (!dialogMode || !listening) return;
    var v = rms();
    var now = Date.now();
    if (v > VOL_TRESH){ lastLoudAt = now; speechSeen = true; }
    // конец речи: был громкий кусок и тишина дольше 1.2 с — завершаем распознавание
    if (speechSeen && now - lastLoudAt > 1200 && !finalizedFlag){
      finalizedFlag = true;
      try{ if (recog) recog.stop(); }catch(e){}
      return;
    }
    // тишина с самого начала дольше 3.5 с — на этом языке никто не говорит,
    // переключаем язык прослушивания
    if (!speechSeen && now - listenStartedAt > 3500){
      dlgFlip = true;
      dlgMisses = 0;
      dlgListen();
    }
  }, 100);
}

// ---------- режим диалога ----------
// Определяем язык говорящего по письменности распознанного текста:
// хангыль → кореец, кириллица → русский
function detectLang(text){
  var hangul = (text.match(/[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/g) || []).length;
  var cyr = (text.match(/[\u0400-\u04FF]/g) || []).length;
  if (hangul > cyr) return 'ko';
  if (cyr > 0) return 'ru';
  return null;
}

function dlgListenLang(){
  var lang;
  if (dlgExpect !== 'auto') lang = dlgExpect;
  else if (!dlgLastSpeaker) lang = 'ru';          // старт: слушаем русского
  else lang = dlgLastSpeaker === 'ru' ? 'ko' : 'ru'; // дальше — отвечает другой
  if (dlgFlip){ lang = lang === 'ru' ? 'ko' : 'ru'; dlgFlip = false; }
  return lang;
}

function dlgSetState(kind, lang){
  var dot = $('dlgDot'), txt = $('dlgText');
  dot.className = 'dot ' + kind;
  if (kind === 'listening')        txt.textContent = '🎤 Слушаю: ' + LANG[lang] + (dlgExpect === 'auto' ? ' (авто)' : '');
  else if (kind === 'translating') txt.textContent = '⏳ Перевожу…';
  else if (kind === 'speaking')    txt.textContent = '🔊 Озвучиваю: ' + LANG[lang];
  else txt.textContent = 'Готов';
}

function dlgListen(){
  if (!dialogMode) return;
  var src = dlgListenLang();
  input.value = ''; lastResult = '';
  dlgSetState('listening', src);
  if (NATIVE){
    AndroidBridge.startListen(BCP[src]);
  } else if (SR){
    webStop();
    startMeter();
    listenStartedAt = Date.now();
    lastLoudAt = listenStartedAt;
    speechSeen = false;
    finalizedFlag = false;
    setTimeout(function(){ if (dialogMode) webStart(); }, 250);
    setTimeout(function(){ if (dialogMode && listening) startVolLoop(); }, 400);
  }
}

function dlgTranslate(text){
  input.value = text;
  var det = detectLang(text);
  // мусор: распознавание не на том языке даёт текст без хангыля и кириллицы —
  // отбрасываем и переключаем язык прослушивания
  var letters = text.replace(/\s/g, '').length;
  var hang = (text.match(/[가-힣]/g) || []).length;
  var cyr = (text.match(/[а-яё]/gi) || []).length;
  if (!det && letters > 0 && (hang + cyr) < letters * 0.5){
    dlgFlip = true;
    dlgMisses = 0;
    setStatus('Не тот язык прослушивания — переключаю', 'err');
    setTimeout(dlgListen, 800);
    return;
  }
  if (!det) det = dlgListenLang();   // скрипт не определился — считаем ожидаемым языком
  dlgLastSpeaker = det;
  dlgMisses = 0;
  dlgErrStreak = 0;
  window._lastSpk = det;
  var other = det === 'ru' ? 'ko' : 'ru';
  beepAccepted();                    // фраза принята
  dlgSetState('translating');
  dlgRun(text, det, other);
}

function dlgRun(text, sl, tl){
  if (busy){ setTimeout(function(){ dlgRun(text, sl, tl); }, 300); return; }
  busy = true;
  doTranslate(text, sl, tl, function(ok, out){
    if (!dialogMode) return;
    if (!ok){ setTimeout(dlgListen, 2000); return; }
    dlgSetState('speaking', tl);
    beepSent();                      // перевод готов, озвучиваем
    speak(out, tl, function(){
      if (!dialogMode) return;
      setTimeout(dlgListen, 600);
    });
  });
}

// ошибка прослушки в диалоге:
// код 7 / «no-speech» = была речь, но не на языке прослушивания → СРАЗУ
// переключаем язык (русский может говорить сколько угодно раз подряд);
// код 1 = полная тишина → остаёмся на том же языке;
// ошибки сервиса (5 и др.) — не переключают язык вовсе
var dlgErrStreak = 0;
function dlgOnListenError(msg, code){
  listening = false;
  micBtn.classList.remove('rec');
  var silence = (code === 1 || code === 'aborted');
  var speechOtherLang = (code === 7 || code === 'no-speech');
  if (dialogMode && speechOtherLang){
    if (dlgExpect === 'auto'){
      dlgFlip = true;
      setStatus('Речь на другом языке — переключаюсь…', 'err');
    } else {
      setStatus('Речь не распознана — слушаю ' + LANG[dlgListenLang()], 'err');
    }
    dlgMisses = 0;
    setTimeout(dlgListen, 1200);
  } else if (dialogMode && silence){
    dlgMisses++;
    if (dlgMisses >= 3 && dlgExpect === 'auto'){
      dlgFlip = true;
      dlgMisses = 0;
      setStatus('Долго тишина — пробую другой язык', 'err');
    } else {
      setStatus('Тишина — слушаю…');
    }
    setTimeout(dlgListen, 1500);
  } else if (dialogMode){
    dlgErrStreak++;
    setStatus(msg, 'err');
    if (dlgErrStreak >= 4){
      dlgErrStreak = 0;
      setStatus('Распознавание не отвечает на языке ' + LANG[dlgListenLang()] +
        '. Проверьте интернет и обновление приложения Google (Android)', 'err');
    }
    setTimeout(dlgListen, 2500);
  } else {
    setStatus(msg, 'err');
  }
}

function dlgStart(){
  if (dialogMode) return;
  dialogMode = true;
  unlockTTS();   // прямой жест: разблокировка звука для iOS
  dlgMisses = 0;
  dlgFlip = false;
  dlgLastSpeaker = null;      // новый диалог всегда начинаем с русского
  $('dlgBtn').classList.add('hidden');
  $('dlgActive').classList.remove('hidden');
  if (NATIVE){ AndroidBridge.stopSpeak(); }
  else {
    if (SR) webStop();   // убиваем ручную сессию микрофона, если была
    if ('speechSynthesis' in window){ speechSynthesis.cancel(); }
  }
  dlgListen();
}

function dlgStop(){
  if (!dialogMode) return;
  dialogMode = false;
  $('dlgBtn').classList.remove('hidden');
  $('dlgActive').classList.add('hidden');
  if (NATIVE){ AndroidBridge.stopListen(); AndroidBridge.stopSpeak(); }
  else {
    if (SR) webStop();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  stopMeter();
  listening = false;
  micBtn.classList.remove('rec');
  setStatus('');
}

$('dlgBtn').addEventListener('click', dlgStart);
$('dlgStop').addEventListener('click', dlgStop);

// запуск микрофона из виджета (нативный вызов после открытия приложения)
window.appOpenMic = function(){
  if (!NATIVE) return;
  if (dialogMode){ dlgListen(); return; }
  AndroidBridge.startListen(BCP[dir.split('2')[0]]);
};

// язык прослушивания: АВТО / РУС / КОР
function setExp(v){
  dlgExpect = v;
  $('expAuto').classList.toggle('active', v === 'auto');
  $('expRu').classList.toggle('active', v === 'ru');
  $('expKo').classList.toggle('active', v === 'ko');
}
$('expAuto').addEventListener('click', function(){ setExp('auto'); });
$('expRu').addEventListener('click', function(){ setExp('ru'); });
$('expKo').addEventListener('click', function(){ setExp('ko'); });

// ---------- голосовой ввод ----------
if (NATIVE){
  // нативный мост: системный SpeechRecognizer Android
  micBtn.addEventListener('click', function(){
    if (dialogMode){ dlgListen(); return; }   // тап по 🎤 перезапускает прослушивание диалога
    if (listening){ AndroidBridge.stopListen(); return; }
    AndroidBridge.startListen(BCP[dir.split('2')[0]]);
  });
  window.onNativeStart = function(){
    if (!dialogMode){
      listening = true;
      micBtn.classList.add('rec');
      setStatus('Говорите…');
    }
  };
  window.onNativePartial = function(t){ input.value = t; };
  window.onNativeFinal = function(t){
    listening = false;
    micBtn.classList.remove('rec');
    if (dialogMode){ dlgTranslate(t); return; }
    input.value = t;
    clearTimeout(trTimer);
    if ($('autoTr').checked) translateNow();
  };
  window.onNativeError = function(msg, code){
    dlgOnListenError(msg, code);
  };
} else {
  if (!SR){
    micBtn.disabled = true;
    $('dlgBtn').disabled = true;
    setStatus('Голосовой ввод не поддерживается этим браузером (нужен Chrome или Safari)', 'err');
  } else {
    // iOS Safari: «подвисший» экземпляр распознавания — частая причина
    // «микрофон не включается» и «не останавливается». Поэтому каждый запуск —
    // на СВЕЖЕМ экземпляре, остановка страхуется принудительным abort().
    var startGuard = null, stopGuard = null;

    // webStop/webStart объявлены как var на верхнем уровне скрипта —
    // их вызывают dlgListen/dlgStart/dlgStop
    recogReset = function(){
      listening = false;
      micBtn.classList.remove('rec');
      if (startGuard){ clearTimeout(startGuard); startGuard = null; }
      if (stopGuard){ clearTimeout(stopGuard); stopGuard = null; }
    };

    makeRecog = function(){
      var r = new SR();
      r.continuous = false;
      r.interimResults = true;
      r.maxAlternatives = 1;
      r.onstart = function(){
        listening = true;
        micBtn.classList.add('rec');
        if (dialogMode){
          dlgSetState('listening', dir.split('2')[0]);
        } else {
          setStatus('Говорите… (язык: ' + LANG[dir.split('2')[0]] + ')');
        }
      };
      r.onresult = function(ev){
        var final = '', interim = '';
        for (var i = ev.resultIndex; i < ev.results.length; i++){
          if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
          else interim += ev.results[i][0].transcript;
        }
        if (final) input.value = final;
        else if (interim) input.value = interim;
        if (final){
          if (dialogMode){ dlgTranslate(final); return; }
          clearTimeout(trTimer);
          if ($('autoTr').checked) translateNow();
        }
      };
      r.onerror = function(ev){
        var m = { 'not-allowed':'Нет доступа к микрофону — разрешите его в настройках',
                  'no-speech':'Речь не распознана', 'network':'Ошибка сети распознавания' };
        listening = false;
        micBtn.classList.remove('rec');
        dlgOnListenError(m[ev.error] || ('Ошибка микрофона: ' + ev.error), ev.error);
      };
      r.onend = function(){
        recogReset();
        if (statusEl.textContent.indexOf('Говорите') === 0) setStatus('');
      };
      return r;
    };

    webStop = function(){
      try{ if (recog) recog.abort(); }catch(e){}
      recog = null;
      recogReset();
    };

    webStart = function(){
      if (listening) return;
      recog = makeRecog();
      try{
        recog.lang = BCP[dir.split('2')[0]];
        recog.start();
      }catch(e){
        // «уже запущен» или разовый сбой — рвём и пробуем ещё раз через 600 мс
        webStop();
        setTimeout(function(){
          if (listening) return;
          recog = makeRecog();
          try{ recog.lang = BCP[dir.split('2')[0]]; recog.start(); }
          catch(e2){ setStatus('Микрофон не запустился — нажмите 🎤 ещё раз', 'err'); }
        }, 600);
        return;
      }
      // страховка: если за 4 сек микрофон так и не включился — сброс
      startGuard = setTimeout(function(){
        if (!listening){
          webStop();
          if (dialogMode){ setTimeout(dlgListen, 800); }
          else setStatus('Микрофон не запустился — нажмите 🎤 ещё раз', 'err');
        }
      }, 4000);
    };

    micBtn.addEventListener('click', function(){
      unlockTTS();   // прямой жест: разблокировка звука для iOS
      if (dialogMode){ dlgListen(); return; }
      if (listening){
        // остановка: stop() + страховка abort() — иначе iOS может не остановиться
        if (stopGuard) clearTimeout(stopGuard);
        try{ if (recog) recog.stop(); }catch(e){ webStop(); return; }
        stopGuard = setTimeout(function(){ webStop(); }, 2500);
        return;
      }
      webStart();
    });
  }
}

// ---------- история-чат ----------
function addHistory(src, dst, sl, tl){
  var who = dialogMode ? (window._lastSpk || sl) : 'you';
  dialogLog.unshift({ who:who, src:src, dst:dst, sl:sl, tl:tl });
  if (dialogLog.length > 50) dialogLog.pop();
  renderHistory();
}
function makeBubble(it){
  var who, cls;
  if (it.who === 'ko'){ who = '🇰🇵 КОРЕЕЦ'; cls = 'them'; }
  else if (it.who === 'ru'){ who = '🇷🇺 РУССКИЙ'; cls = 'me'; }
  else { who = 'ВЫ'; cls = 'me'; }
  var d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<div class="who"></div><div class="orig"></div><div class="dst"></div>';
  d.querySelector('.who').textContent = who;
  d.querySelector('.orig').textContent = it.src;
  d.querySelector('.dst').textContent = it.dst;
  d.addEventListener('click', function(){
    // тап по сообщению: показать и снова озвучить
    input.value = it.src;
    lastResult = it.dst;
    output.textContent = it.dst;
    output.classList.remove('empty');
    showRoman(it.dst, it.tl, null);
    speak(it.dst, it.tl);
    window.scrollTo(0, 0);
  });
  return d;
}
function renderHistory(){
  var h = $('history');
  h.innerHTML = '';
  if (!dialogLog.length){ h.innerHTML = '<div class="h-empty">История пуста</div>'; return; }
  dialogLog.slice().reverse().forEach(function(it){
    h.appendChild(makeBubble(it));
  });
  h.scrollTop = h.scrollHeight;
}
$('chatExpand').addEventListener('click', function(){
  var list = $('chatFullList');
  list.innerHTML = '';
  if (!dialogLog.length) list.innerHTML = '<div class="h-empty">История пуста</div>';
  dialogLog.slice().reverse().forEach(function(it){ list.appendChild(makeBubble(it)); });
  list.scrollTop = list.scrollHeight;
  $('chatFull').classList.remove('hidden');
});
$('chatClose').addEventListener('click', function(){ $('chatFull').classList.add('hidden'); });
</script>
