<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#481173">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Переводчик RWB · РУС ⇄ КОР</title>
<style>
  /* --- адаптив: всё на одном экране без прокрутки страницы --- */
  html, body{ height:100%; overflow:hidden; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#FAFAFA; color:#2b1a3a;
    height:100dvh;                     /* dvh: адресная строка мобильных */
    max-width:100%; overflow-x:hidden;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ---------- шапка (фикс. зона) ---------- */
  header{
    flex-shrink:0; padding:clamp(8px,1.5vh,14px) clamp(10px,3vw,16px);
    display:flex; align-items:center; justify-content:space-between;
    background:#481173; color:#fff;
  }
  header h1{ font-size:clamp(15px,4vw,20px); font-weight:700; letter-spacing:.3px; }
  #verBadge{ font-size:clamp(10px,2vw,12px); background:rgba(255,255,255,.18); color:#F9E6F5; padding:2px 8px; border-radius:10px; }
  /* ---------- статус «кого ждёт» (фикс. зона) ---------- */
  #status{
    flex-shrink:0;
    margin:clamp(6px,1.2vh,12px) clamp(8px,3vw,14px) 0;
    padding:clamp(8px,1.5vh,14px) 10px; border-radius:12px; text-align:center;
    font-size:clamp(14px,2.5vw,20px); font-weight:700;
    min-height:clamp(44px,7vh,60px);
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:#F9E6F5; color:#481173; transition:background .2s;
  }
  #status.listen{ background:#CB11AB; color:#fff; }   /* маджента — СЛУШАЮ */
  #status.think{  background:#A50F8A; color:#fff; }   /* приглушённая — ДУМАЮ */
  #status.speak{  background:#481173; color:#fff; }   /* тёмно-фиолетовый — ОЗВУЧИВАЮ */
  #status.err{    background:#B3261E; color:#fff; }   /* красная — ошибка, КРУПНО */
  /* ---------- панели (средняя зона: скроллится только текст) ---------- */
  #panels{
    flex:1; min-height:0; overflow:hidden;
    display:flex; gap:clamp(6px,1.5vw,10px);
    padding:clamp(6px,1.2vh,12px) clamp(8px,3vw,14px);
  }
  .panel{
    flex:1; min-width:0; overflow:hidden;
    background:#FFFFFF; border:1px solid #F0E0EC; border-radius:14px;
    box-shadow:0 2px 8px rgba(72,17,115,.08);
    display:flex; flex-direction:column;
  }
  .panel h2{
    flex-shrink:0;
    font-size:clamp(12px,2vw,15px); font-weight:700; padding:8px 10px;
    background:#481173; color:#fff;
  }
  .panel .log{
    flex:1; min-height:0; overflow-y:auto; padding:8px;
    display:flex; flex-direction:column; gap:6px;
  }
  .bubble{
    background:#F9E6F5; color:#3a1d52; border-radius:10px;
    padding:8px 10px; font-size:clamp(14px,2.5vw,18px);
    line-height:1.35; word-wrap:break-word; max-width:95%;
  }
  .bubble.last{ background:#CB11AB; color:#fff; }
  .bubble .src{ font-size:clamp(10px,1.8vw,12px); opacity:.7; display:block; margin-bottom:2px; }
  .panel .foot{
    flex-shrink:0; padding:8px; border-top:1px solid #F0E0EC;
    display:flex; justify-content:flex-end;
  }
  .rbtn{
    background:#CB11AB; color:#fff; border:0; border-radius:8px;
    padding:8px 14px; font-size:clamp(13px,2.2vw,15px);
  }
  .rbtn:active{ background:#481173; }
  /* ---------- микрофон (нижняя фикс. зона) ---------- */
  #micwrap{
    flex-shrink:0; display:flex; justify-content:center;
    padding:clamp(4px,1vh,8px) 0 clamp(10px,2vh,18px);
  }
  #micBtn{
    width:clamp(64px,14vw,88px); height:clamp(64px,14vw,88px);
    border-radius:50%; border:none;
    background:#CB11AB; color:#fff; font-size:clamp(30px,7vw,40px); cursor:pointer;
    box-shadow:0 4px 14px rgba(203,17,171,.35);
  }
  #micBtn.on{ background:#481173; animation:micpulse 1.4s infinite; } /* запись = тёмно-фиолетовый + пульс */
  @keyframes micpulse{
    0%,100%{ box-shadow:0 4px 14px rgba(72,17,115,.35); }
    50%{ box-shadow:0 4px 22px rgba(72,17,115,.65); }
  }
  #micBtn:disabled{ opacity:.45; }
</style>
</head>
<body>
<header>
  <h1>Переводчик RWB</h1>
  <span id="verBadge">v4.4 · iOS mic fix</span>
</header>

<div id="status">Нажмите микрофон, чтобы начать диалог</div>

<div id="panels">
  <div class="panel">
    <h2>Русский</h2>
    <div class="log" id="logRu"></div>
    <div class="foot"><button class="rbtn" id="repRu">🔊 Повторить</button></div>
  </div>
  <div class="panel">
    <h2>Корейский</h2>
    <div class="log" id="logKo"></div>
    <div class="foot"><button class="rbtn" id="repKo">🔊 반복</button></div>
  </div>
</div>

<div id="micwrap"><button id="micBtn" title="Говорить / Стоп">🎤</button></div>

<script>
/* ================================================================
 * ПЕРЕВОДЧИК RWB — сборка с нуля (one-shot), vanilla JS, 1 файл.
 * Никаких LLM API: только бесплатные MT-эндпоинты.
 * Все глобальные переменные объявлены var — strict mode не убьёт скрипт.
 * ================================================================ */

/* ---------- КОНФИГ API (править здесь) ---------- */
var API_CONFIG = {
  // DeepLX: адрес СВОЕГО Cloudflare Worker с DeepLX (бесплатный, без ключа).
  // Пустая строка = шаг пропускается и идём сразу на MyMemory.
  // Пример: 'https://my-worker.name.workers.dev/translate'
  deeplxUrl: '',

  // MyMemory: анонимный, ~5000 символов/день без ключа. CORS разрешён.
  mymemoryUrl: 'https://api.mymemory.translated.net/get',

  // Google gtx (неофициальный, бесплатный, без ключа; CORS открыт).
  // Запасной вариант, если MyMemory исчерпал дневной лимит.
  gtxUrl: 'https://translate.googleapis.com/translate_a/single',

  mtTimeoutMs: 6000          // таймаут на ОДИН эндпоинт (плохой Wi-Fi склада)
};

/* ---------- СЕВЕРОКОРЕЙСКАЯ НОРМА (문화어) ----------
 * Массив пар [южнокорейский/стандартный вариант, северокорейский вариант].
 * Применяется как постобработка ПОСЛЕ машинного перевода (ни один
 * публичный API не умеет «северокорейский» как целевой язык).
 * Источники для пополнения: 조선말규범집, 북한말사전, учебники КНДР
 * на Internet Archive. Словарь расширяемый — просто добавляйте пары.
 * Порядок не важен: замена идёт по всей строке, длинные пары — первыми. */
var NORTH_KOREAN_LEXICON = [
  /* — написания с начальными ㄹ/ㄴ (правило 문화어) — */
  ['여자','녀자'], ['여권','려권'], ['여관','려관'], ['이발소','리발소'],
  ['노동','로동'], ['연락','련락'],
  ['냉장고','랭장고'], ['냉동','랭동'], ['에어컨','랭방기'],
  /* — лексика — */
  ['아이스크림','얼음과자'], ['옥상','살마루'], ['옥수수','강냉이'],
  ['애호박','청둥호박'], ['화장실','위생실'], ['경찰','보안원'],
  ['월급','로임'], ['급여','로임'], ['임금','로임'],
  ['기차','렬차'], ['공항','비행장'], ['선생님','교원'],
  ['볼펜','원주필'], ['컴퓨터','전자계산기'], ['카메라','사진기'],
  ['호텔','려관'], ['크레인','기중기'], ['음료수','청량음료'],
  ['축구','측구'], ['인터넷','인터네트'], ['로봇','로보트'],
  ['샴푸','머리감는비누'], ['스킨','화장수'], ['버스','뻐스'],
  ['텔레비전','텔레비죤'], ['로켓','로켓트'], ['배터리','전지']
];

/* ---------- СЛОВАРЬ СКЛАДСКИХ ТЕРМИНОВ WILDBERRIES ----------
 * Если термин (или сокращение) есть в РУСКОМ исходнике, он принудительно
 * подставляется в перевод — даже если API перевёл иначе. Механика:
 * термин маскируется латинским токеном T1Q..TnQ (латиница выживает в MT),
 * текст переводится, токен заменяется на корейский эквивалент.
 * Если у термина два варианта через «/» — берётся первый. */
var WB_WAREHOUSE_GLOSSARY = [
  ['ТСД',           '데이터수집단말기'],   // терминал сбора данных
  ['терминал сбора данных', '데이터수집단말기'],
  ['КГТ',           '대형화물'],           // крупногабаритный товар
  ['СГТ',           '초대형화물'],          // сверхгабаритный товар
  ['КБТ',           '대형가전제품'],        // крупная бытовая техника
  ['тара',          '포장용기'],            // (второй вариант: 짐함)
  ['паллета',       '파렛트'],
  ['монопаллета',   '단일파렛트'],
  ['монокороб',     '단일상자'],
  ['ШК',            '바코드'],              // штрихкод
  ['штрихкод',      '바코드'],
  ['приёмка',       '물건접수'],
  ['приемка',       '물건접수'],            // без «ё»
  ['отгрузка',      '발송'],
  ['сортировка',    '분류'],
  ['ячейка',        '창고칸'],
  ['стрейч-плёнка', '늘임비닐'],
  ['стрейч плёнка', '늘임비닐'],
  ['стрейч-пленка', '늘임비닐'],
  ['склад',         '창고'],
  ['коробка',       '상자'],
  ['короб',         '상자'],
  ['весы',          '저울'],
  ['накладная',     '송장']
];

/* ---------- состояние (ВСЕ глобальные — var) ---------- */
var recog = null;            // текущий SpeechRecognition
var dlgOn = false;           // диалоговая сессия активна
var dlgCurLang = 'ru-RU';    // кого слушаем СЕЙЧАС
var dlgPhase = 'idle';       // idle | listen | think | speak
var thinkTimer = null;       // таймер «раздумий»
var restartTimer = null;     // отложенный рестарт прослушивания
var chainTimer = null;       // сторож цепочки think→speak: если зависла — форсируем слушание
var curUtter = null;         // глобальная ссылка на utterance (Chrome GC убивает onend)
var restartPauseN = 0;       // растущая пауза против петли пустых сессий
var _dlgFinalAt = 0;         // финал пришёл — onend не перезапускает цепочку
var _dlgErrAt = 0;           // ошибка уже обработана — не дублировать рестарт
var speakGen = 0;            // ген-токен озвучки: старые цепочки onend глохнут
var lastRuText = '';         // последний русский текст (кнопка 🔊)
var lastKoText = '';         // последний корейский текст (кнопка 🔊)
var ruVoice = null;          // мужской русский голос
var koVoice = null;          // женский корейский голос
var voicesReady = false;
var micWarm = false;         // разрешение на микрофон уже запрошено
/* --- платформа (различия Android vs iPhone) --- */
var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IS_ANDROID = /Android/.test(navigator.userAgent);
var voiceRetryN = 0;         // повторы догрузки списка голосов (iOS отдаёт асинхронно)
var ruHasAny = false;        // есть ли ХОТЬ какой-то русский голос
var koHasAny = false;        // есть ли хоть какой-то корейский голос
var ttsWarnedRu = false;     // одноразовые предупреждения «озвучка недоступна»
var ttsWarnedKo = false;
var listenWatch = null;      // сторож iOS: start() вызван, но onresult молчит
var gotResult = false;       // пришёл ли хоть какой-то onresult в текущей сессии
var iosStuckN = 0;           // счётчик «зависших» стартов (лестница повторов)

/* =================== UI =================== */
function $(id){ return document.getElementById(id); }

function setStatus(text, cls){
  var st = $('status');
  st.textContent = text;
  st.className = cls || '';
}
function showErr(msg){
  // ошибки микрофона/API — КРУПНО на статус-плашке, не мелким шрифтом
  setStatus(msg, 'err');
}
function addBubble(panelId, text, sourceLabel){
  var log = $(panelId);
  var prev = log.querySelector('.bubble.last');
  if (prev) prev.className = 'bubble';
  var b = document.createElement('div');
  b.className = 'bubble last';
  if (sourceLabel){
    var s = document.createElement('span');
    s.className = 'src';
    s.textContent = sourceLabel;
    b.appendChild(s);
  }
  b.appendChild(document.createTextNode(text));
  log.appendChild(b);
  log.scrollTop = log.scrollHeight;
  // держим не больше 30 пузырей на панель
  while (log.children.length > 30) log.removeChild(log.firstChild);
}

/* =================== ОПРЕДЕЛЕНИЕ ЯЗЫКА =================== */
function detectLang(text){
  // хангыль → источник корейский, кириллица → русский
  if (/[\uAC00-\uD7AF\u1100-\u11FF]/.test(text)) return 'ko';
  if (/[\u0400-\u04FF]/.test(text)) return 'ru';
  return null;
}

/* =================== СЛОВАРЬ + СЕВЕРНАЯ НОРМА =================== */
function maskGlossary(text){
  /* маскируем найденные термины латинскими токенами T1Q..TnQ.
     Русские слова склоняются («на монопаллету», «в ячейке») — поэтому
     длинные термины (≥4 букв) ищем по ОСНОВЕ (без последней буквы) и
     забираем в токен до 3 хвостовых букв (падежное окончание уходит
     вместе с термином — в переводе не остаётся «단일파렛ту»).
     Слева проверяем границу слова: «тар» не должен ловиться внутри
     «старший». Аббревиатуры (ТСД, КГТ…) — целиком, та же проверка слева. */
  var pairs = WB_WAREHOUSE_GLOSSARY.slice().sort(function(a,b){
    return b[0].length - a[0].length;           // длинные термины первыми
  });
  var map = {};
  var n = 0;
  var out = text;
  function isCyr(ch){ return /[а-яёА-ЯЁ]/.test(ch); }
  for (var i = 0; i < pairs.length; i++){
    var orig = pairs[i][0].replace(/ё/g,'е');
    var useStem = orig.length >= 4;
    var core = useStem ? orig.slice(0, -1) : orig;   // основа слова
    var tail = useStem ? '[а-яё]{0,3}' : '';
    var re = new RegExp(core.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + tail, 'gi');
    out = out.replace(re, function(m, off){
      var before = off > 0 ? out.charAt(off - 1) : ' ';
      if (isCyr(before)) return m;               // часть другого слова — не трогаем
      if (!useStem){
        var after = out.charAt(off + m.length);
        if (after && isCyr(after)) return m;     // «шк» внутри «шкафа» — не трогаем
      }
      n += 1;
      map['T' + n + 'Q'] = pairs[i][1];
      return 'T' + n + 'Q';
    });
  }
  return { text: out, map: map };
}

function unmaskGlossary(text, map){
  var out = text;
  for (var k in map){
    if (!map.hasOwnProperty(k)) continue;
    var re = new RegExp(k, 'g');
    out = out.replace(re, map[k]);
  }
  return out;
}

function fixParticles(text){
  /* после замены слов по словарю ломается частица: 얼음과자을 → 얼음과자를.
     Правим 을/를 по последней букве предыдущего слова:
     есть финальная согласная (종성) → 을, гласная → 를. */
  function hasJong(ch){
    var c = ch.charCodeAt(0);
    if (c < 0xAC00 || c > 0xD7A3) return true;   // не слог — считаем согласной
    return ((c - 0xAC00) % 28) !== 0;
  }
  return text
    .replace(/([가-힣]+)(을|를)/g, function(all, word){
      return word + (hasJong(word.charAt(word.length - 1)) ? '을' : '를');
    })
    .replace(/([가-힣]+)(으로|로)/g, function(all, word){
      var last = word.charAt(word.length - 1);
      if (!hasJong(last)) return word + '로';    // гласная → 로
      var c = last.charCodeAt(0);
      var jong = (c - 0xAC00) % 28;
      return word + (jong === 7 ? '로' : '으로'); // ㄹ → 로, остальные согласные → 으로
    });
}

function applyNorthKorean(text){
  /* южная норма → 문화어: замена по словарю, длинные пары первыми */
  var pairs = NORTH_KOREAN_LEXICON.slice().sort(function(a,b){
    return b[0].length - a[0].length;
  });
  var out = text;
  for (var i = 0; i < pairs.length; i++){
    var re = new RegExp(pairs[i][0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
    out = out.replace(re, pairs[i][1]);
  }
  return fixParticles(out);
}

/* =================== ПЕРЕВОД (без LLM) =================== */
function mtFetch(url, opts){
  /* fetch с жёстким таймаутом: на плохом Wi-Fi busy не залипает навсегда */
  return new Promise(function(res, rej){
    var settled = false;
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var t = setTimeout(function(){
      if (settled) return;
      settled = true;
      if (ctl) try { ctl.abort(); } catch(e){}
      rej(new Error('timeout'));
    }, API_CONFIG.mtTimeoutMs);
    if (ctl && opts) opts.signal = ctl.signal;
    fetch(url, opts).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(j){
      if (settled) return;
      settled = true; clearTimeout(t); res(j);
    }).catch(function(e){
      if (settled) return;
      settled = true; clearTimeout(t); rej(e);
    });
  });
}

function viaDeeplx(text, src, tgt){
  if (!API_CONFIG.deeplxUrl) return Promise.reject(new Error('deeplx off'));
  return mtFetch(API_CONFIG.deeplxUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text: text,
      source_lang: src.toUpperCase(),
      target_lang: tgt.toUpperCase()
    })
  }).then(function(j){
    var out = j && (j.data || j.translation || j.alternatives && j.alternatives[0]);
    if (!out) throw new Error('deeplx empty');
    return out;
  });
}

function viaMyMemory(text, src, tgt){
  var url = API_CONFIG.mymemoryUrl +
    '?q=' + encodeURIComponent(text) +
    '&langpair=' + src + '|' + tgt;
  return mtFetch(url).then(function(j){
    var d = j && j.responseData;
    var out = d && d.translatedText;
    // лимит/ошибка MyMemory приходит обычным текстом с WARNING
    if (!out || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(out)){
      throw new Error('mymemory limit');
    }
    return out;
  });
}

function viaGtx(text, src, tgt){
  var url = API_CONFIG.gtxUrl +
    '?client=gtx&sl=' + src + '&tl=' + tgt + '&dt=t' +
    '&q=' + encodeURIComponent(text);
  return mtFetch(url).then(function(j){
    if (!j || !j[0] || !j[0].length) throw new Error('gtx empty');
    var out = '';
    for (var i = 0; i < j[0].length; i++){
      if (j[0][i] && j[0][i][0]) out += j[0][i][0];
    }
    if (!out) throw new Error('gtx empty');
    return out;
  });
}

function translateText(text, src, tgt, cb){
  /* цепочка fallback: DeepLX → MyMemory → Google gtx → ошибка.
     Никаких LLM API (OpenAI/GLM/Claude) — только эти три. */
  var masked = { text: text, map: {} };
  if (src === 'ru'){
    masked = maskGlossary(text);
  }
  var chain = [viaDeeplx, viaMyMemory, viaGtx];
  var idx = 0;
  function attempt(){
    if (idx >= chain.length){ cb(null); return; }
    var fn = chain[idx]; idx += 1;
    fn(masked.text, src, tgt).then(function(out){
      if (src === 'ru') out = unmaskGlossary(out, masked.map);
      if (tgt === 'ko') out = applyNorthKorean(out);
      cb(out);
    }).catch(function(){ attempt(); });
  }
  attempt();
}

/* =================== ОЗВУЧКА =================== */
/* Настоящий северокорейский акцент браузерным TTS НЕ даётся — движки
 * Chrome/Safari отдают только южнокорейские голоса. Для настоящего
 * акцента нужен внешний TTS (вне этого файла). Здесь: ko → женский голос,
 * ru → мужской голос, насколько позволяет система. */
function pickVoice(lang, malePrefs, femalePrefs){
  var vs = speechSynthesis.getVoices();
  var pool = [];
  for (var i = 0; i < vs.length; i++){
    if (vs[i].lang && vs[i].lang.toLowerCase().indexOf(lang) === 0) pool.push(vs[i]);
  }
  var prefs = (lang === 'ru') ? malePrefs : femalePrefs;
  for (var p = 0; p < prefs.length; p++){
    for (var v = 0; v < pool.length; v++){
      if (pool[v].name.indexOf(prefs[p]) !== -1){
        pool[v]._pref = true;                 // голос нужного пола найден
        return pool[v];
      }
    }
  }
  return pool.length ? pool[0] : null;        // fallback: любой голос языка
}

function warnNoTTS(lang){
  /* голосов для языка нет ВОВСЕ — не молчим: текст перевода уже на экране,
     объясняем, где включить/скачать голоса на этой платформе */
  var isRu = (lang === 'ru');
  if (isRu ? ttsWarnedRu : ttsWarnedKo) return;
  if (isRu) ttsWarnedRu = true; else ttsWarnedKo = true;
  var how;
  if (IS_IOS){
    how = 'На iPhone: Настройки → Универсальный доступ → Устный контент → Голоса — скачайте нужный голос.';
  } else if (IS_ANDROID){
    how = 'На Android: Настройки → Система → Языки и ввод → Синтез речи → Google TTS → установите голоса.';
  } else {
    how = 'На этом устройстве нет подходящего голоса синтеза речи.';
  }
  addBubble(isRu ? 'logRu' : 'logKo', '⚠ Озвучка недоступна на этом устройстве. ' + how, null);
}

function countVoices(lang){
  var vs = speechSynthesis.getVoices();
  var n = 0;
  for (var i = 0; i < vs.length; i++){
    if (vs[i].lang && vs[i].lang.toLowerCase().indexOf(lang) === 0) n += 1;
  }
  return n;
}

function loadVoices(){
  var vs = speechSynthesis.getVoices();
  if (!vs.length){
    /* iOS отдаёт список голосов асинхронно и не всегда шлёт voiceschanged —
       добираем повторами с задержкой, а не только по событию */
    if (voiceRetryN++ < 20) setTimeout(loadVoices, 500);
    return;
  }
  // русский мужской: Pavel/Artemiy/Dmitry (Win), Google русский; иначе любой ru
  ruVoice = pickVoice('ru', ['Pavel','Artemiy','Dmitry','Google русский','Milena','Tatyana'], []);
  // корейский женский: Yuna/SunHi (Win/Edge), Heami, Google 한국어; иначе любой ko.
  // ko-KP в списке голосов не бывает — ищем по префиксу 'ko' (covers ko-KR).
  koVoice = pickVoice('ko', [], ['Yuna','SunHi','Heami','Google 한국어','Sora']);
  ruHasAny = countVoices('ru') > 0;
  koHasAny = countVoices('ko') > 0;
  voicesReady = true;
  // пол не совпал — работаем с любым голосом языка (не молчим)
  if (ruVoice && !ruVoice._pref) console.warn('Голос male для ru не найден. Использую доступный.');
  if (koVoice && !koVoice._pref) console.warn('Голос female для ko не найден. Использую доступный.');
}

function stopSpeaking(){
  /* глушим ВСЁ: и speechSynthesis, и старые GT-аудио через ген-токен */
  speakGen += 1;
  try { speechSynthesis.cancel(); } catch(e){}
}

function speak(text, lang, onDone){
  stopSpeaking();
  var gen = speakGen;
  if (dlgPhase !== 'idle') dlgPhase = 'speak';
  setStatus(lang === 'ru' ? 'Говорю (рус)…' : '말하는 중 (кор)…', 'speak');
  var u = new SpeechSynthesisUtterance(text);
  curUtter = u;                       // держим глобально: GC может убить onend
  u.lang = (lang === 'ru') ? 'ru-RU' : 'ko-KR'; // ko-KP браузерные движки не дают
  var v = (lang === 'ru') ? ruVoice : koVoice;
  if (!v){
    loadVoices();                     // голоса могли доехать асинхронно после старта
    v = (lang === 'ru') ? ruVoice : koVoice;
  }
  if (!v){
    console.warn('Голос для ' + lang + ' не найден. Использую системный по умолчанию.');
    if (!((lang === 'ru') ? ruHasAny : koHasAny)) warnNoTTS(lang);
  }
  if (v) u.voice = v;
  u.rate = 0.95;
  var finished = false;
  function done(){
    if (gen !== speakGen || finished) return;   // старая цепочка — молча выходим
    finished = true;
    if (curUtter === u) curUtter = null;
    if (onDone) onDone();
  }
  u.onend = done;
  u.onerror = done;
  speechSynthesis.speak(u);
  // страховка: onend на Android/iOS может НЕ прийти вовсе — ждём по длине
  // текста, а не вечно (45 с сторож цепочки остаётся последним рубежом)
  var guardMs = Math.min(25000, 6000 + text.length * 150);
  setTimeout(done, guardMs);
}

/* =================== ДИАЛОГ =================== */
/* FALLBACK НА iOS (если костыли ниже не помогут на конкретном iPhone):
 * WebKit bug 317741 — после speechSynthesis аудиосессия микрофона не
 * освобождается, recognition.start() виснет без onresult. Радикальное
 * решение, если придётся: отказаться от webkitSpeechRecognition на iOS
 * и перейти на MediaRecorder (запись аудио) + внешний STT (бесплатный
 * эндпоинт или локальная модель). Живое распознавание теряется, но баг
 * обходится полностью. Точка переключения — здесь, в dlgListen(). */
function warmMic(){
  /* ОДИН раз запрашиваем разрешение и СРАЗУ гасим поток:
     открытый getUserMedia-поток блокирует SpeechRecognition на iOS
     (историческая бабка v1.8), поэтому метр громкости здесь не нужен вовсе */
  if (micWarm) return Promise.resolve();
  micWarm = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve();
  return navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    stream.getTracks().forEach(function(t){ t.stop(); });
  }).catch(function(){
    /* разрешение спросит сам SpeechRecognition — не блокируем старт */
  });
}

function webStop(){
  /* свой abort — НЕ ошибка: помечаем экземпляр убитым, иначе Chrome кинет
     onerror('aborted') и отложенный рестарт убьёт следующую сессию (урок v3.4) */
  if (recog){
    try { recog._killed = true; recog.abort(); } catch(e){}
    recog = null;
  }
  if (listenWatch){ clearTimeout(listenWatch); listenWatch = null; }
}

function dlgListen(){
  if (!dlgOn) return;
  dlgPhase = 'listen';
  setStatus(dlgCurLang === 'ru-RU' ? 'Слушаю (рус)…' : '듣는 중 (кор)…', 'listen');
  webStop();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    showErr(IS_IOS
      ? 'На iPhone распознавание речи работает в Safari. Откройте сайт в Safari и проверьте: Настройки → Siri и Поиск → включено ли «Распознавание речи».'
      : 'Браузер не поддерживает распознавание речи. Откройте в Chrome или Safari.');
    return;
  }
  recog = new SR();
  recog.lang = dlgCurLang;           // язык доносим ДО распознавателя явно
  /* WebKit на iOS обрабатывает continuous иначе и копит транскрипт со сбоями —
     на iOS continuous=false + перезапуск в onend; на Android continuous=true */
  recog.continuous = !IS_IOS;
  recog.interimResults = true;
  recog.maxAlternatives = 1;

  recog.onresult = function(ev){
    gotResult = true;                        // микрофон жив — сторож зависания не нужен
    iosStuckN = 0;
    if (listenWatch){ clearTimeout(listenWatch); listenWatch = null; }
    var fin = '';
    for (var i = ev.resultIndex; i < ev.results.length; i++){
      if (ev.results[i].isFinal) fin += ev.results[i][0].transcript;
    }
    if (fin.trim()){
      _dlgFinalAt = Date.now();
      restartPauseN = 0;
      dlgFinal(fin.trim());
    }
  };

  recog.onerror = function(ev){
    if (recog && recog._killed) return;        // убили сами — игнор
    if (ev.error === 'aborted' || ev.error === 'no-speech') return; // не ошибки
    _dlgErrAt = Date.now();
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
      showErr(IS_IOS
        ? 'Микрофон запрещён. Разрешите доступ: Настройки → Safari → Микрофон, и при запросе в Safari нажмите «Разрешить».'
        : 'Микрофон запрещён. Разрешите доступ к микрофону в настройках браузера.');
      dlgOn = false;
      $('micBtn').classList.remove('on');
      $('micBtn').textContent = '🎤';
      return;
    }
    if (ev.error === 'network'){
      showErr('Нет связи с сервисом распознавания. Проверьте интернет.');
    }
    scheduleRestart(1200);
  };

  recog.onend = function(){
    if (recog && recog._killed) return;
    // финал пришёл — цепочку продолжит dlgFinal (думаю → озвучка → слушать)
    if (Date.now() - _dlgFinalAt < 800) return;
    if (Date.now() - _dlgErrAt < 800) return;  // ошибку уже обработали
    // сессия кончилась БЕЗ финала (метка v3.2) — перезапускаем молча,
    // с растущей паузой против петли пустых сессий
    scheduleRestart(700 + 400 * restartPauseN);
  };

  try { recog.start(); } catch(e){ scheduleRestart(1500); }

  /* iOS: start() может «виснуть» (баг WebKit 317741) — сессия открыта,
     но onresult не приходит. Через 5 с тишины от распознавателя сбрасываем
     зависший экземпляр (abort) и создаём НОВЫЙ с нарастающей задержкой:
     300 → 1000 → 2000 → 3500 мс (дальше держим 3500) */
  if (IS_IOS){
    gotResult = false;
    if (listenWatch) clearTimeout(listenWatch);
    listenWatch = setTimeout(function(){
      listenWatch = null;
      if (!dlgOn || dlgPhase !== 'listen' || gotResult) return;
      webStop();                             // abort зависшего экземпляра
      var ladder = [300, 1000, 2000, 3500];
      scheduleRestart(ladder[Math.min(iosStuckN, 3)]);
      iosStuckN += 1;
    }, 5000);
  }
}

function scheduleRestart(delay){
  if (!dlgOn) return;
  if (restartTimer) clearTimeout(restartTimer);
  restartPauseN = Math.min(restartPauseN + 1, 12);   // cap паузы 5.5 с
  restartTimer = setTimeout(function(){
    restartTimer = null;
    dlgListen();
  }, Math.min(delay, 6000));
}

function dlgFinal(text){
  webStop();
  // новый финал перезапускает цепочку: старые таймеры гасим, иначе
  // второй финал во время «раздумий» задвоит перевод и озвучку
  if (thinkTimer){ clearTimeout(thinkTimer); thinkTimer = null; }
  if (chainTimer){ clearTimeout(chainTimer); chainTimer = null; }
  var src = detectLang(text);
  if (!src) src = (dlgCurLang === 'ru-RU') ? 'ru' : 'ko';
  var tgt = (src === 'ru') ? 'ko' : 'ru';

  if (src === 'ru'){
    lastRuText = text;
    addBubble('logRu', text, 'сказано');
  } else {
    lastKoText = text;
    addBubble('logKo', text, '말함');
  }

  dlgPhase = 'think';
  /* ЗАДЕРЖКА НА «РАЗДУМЬЯ» 4–6 с — по требованию, не оптимизировать */
  var wait = 4000 + Math.floor(Math.random() * 2000);
  setStatus('Думаю… (перевод через несколько секунд)', 'think');

  /* сторож цепочки: если think/speak зависли (TTS onend не пришёл,
     а это регулярно бывает на Android/iOS) — форсируем возврат к слушанию */
  chainTimer = setTimeout(function(){
    chainTimer = null;
    if (dlgOn && dlgPhase !== 'listen' && dlgPhase !== 'idle'){
      stopSpeaking();
      nextListen();
    }
  }, 45000);

  thinkTimer = setTimeout(function(){
    thinkTimer = null;
    translateText(text, src, tgt, function(out){
      if (!dlgOn && !out) return;
      if (!out){
        if (src === 'ru'){ lastKoText = '[перевод недоступен]'; addBubble('logKo', '[перевод недоступен]'); }
        else { lastRuText = '[перевод недоступен]'; addBubble('logRu', '[перевод недоступен]'); }
        nextListen();
        return;
      }
      if (tgt === 'ru'){
        lastRuText = out;
        addBubble('logRu', out, 'перевод');
      } else {
        lastKoText = out;
        addBubble('logKo', out, '번역');
      }
      speak(out, tgt, nextListen);
    });
  }, wait);
}

function nextListen(){
  if (chainTimer){ clearTimeout(chainTimer); chainTimer = null; }
  if (!dlgOn) { dlgPhase = 'idle'; return; }
  /* после фразы русского слушаем корейца и наоборот */
  dlgCurLang = (dlgCurLang === 'ru-RU') ? 'ko-KR' : 'ru-RU';
  /* WebKit 317741: на iOS аудиосессия микрофона не освобождается сразу
     после speechSynthesis — перед перезапуском распознавания выдерживаем
     9 с паузы (повышает шанс, что сессия «отпустится»). Android: 1 с. */
  if (IS_IOS) setStatus('Секунду, включаю микрофон…', '');
  scheduleRestart(IS_IOS ? 9000 : 1000);
}

function dlgStart(){
  if (dlgOn) return;
  dlgOn = true;
  dlgPhase = 'idle';
  restartPauseN = 0;
  _dlgFinalAt = 0;
  _dlgErrAt = 0;
  $('micBtn').classList.add('on');
  $('micBtn').textContent = '⏹';
  if (!voicesReady) loadVoices();
  // прогрев TTS должен закончиться до старта распознавания (iOS, урок v1.8)
  try {
    var warm = new SpeechSynthesisUtterance(' ');
    warm.volume = 0.03;
    if (ruVoice) warm.voice = ruVoice;
    speechSynthesis.speak(warm);
  } catch(e){}
  warmMic().then(function(){
    setTimeout(function(){ if (dlgOn) dlgListen(); }, 1000);
  });
}

function dlgStop(){
  dlgOn = false;
  dlgPhase = 'idle';
  if (thinkTimer){ clearTimeout(thinkTimer); thinkTimer = null; }
  if (restartTimer){ clearTimeout(restartTimer); restartTimer = null; }
  if (chainTimer){ clearTimeout(chainTimer); chainTimer = null; }
  webStop();
  stopSpeaking();
  $('micBtn').classList.remove('on');
  $('micBtn').textContent = '🎤';
  setStatus('Остановлено. Нажмите микрофон, чтобы продолжить');
}

/* =================== КНОПКИ =================== */
$('micBtn').addEventListener('click', function(){
  if (dlgOn) dlgStop(); else dlgStart();
});
$('repRu').addEventListener('click', function(){
  if (!lastRuText) return;
  stopSpeaking();
  dlgPhase = 'speak';
  speak(lastRuText, 'ru', function(){ if (dlgOn) dlgListen(); else dlgPhase = 'idle'; });
});
$('repKo').addEventListener('click', function(){
  if (!lastKoText) return;
  stopSpeaking();
  dlgPhase = 'speak';
  speak(lastKoText, 'ko', function(){ if (dlgOn) dlgListen(); else dlgPhase = 'idle'; });
});

/* голоса подгружаются асинхронно — стартуем загрузку сразу */
if ('speechSynthesis' in window) loadVoices();
else showErr('Браузер не поддерживает синтез речи. Откройте в Chrome или Safari.');
</script>
